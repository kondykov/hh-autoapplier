# Локальный почтовый сервер для демо-приложения: GreenMail, SMTP :3025, IMAP :3143, ящик demo/secret (demo@example.com).
# Письма живут в памяти до остановки. Веб-интерфейса нет — читать через демо: dotnet run --project samples/Postbox.Demo -- inbox --all
services:
  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=demo:secret@example.com
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
