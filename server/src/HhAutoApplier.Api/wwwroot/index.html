<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hh-autoapplier</title>
  <!-- Логотип (вариант A логотипа бота, #120): «hh=#» -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='21' font-family='Consolas,monospace' font-size='12' font-weight='700' text-anchor='middle' fill='%23e6edf3'%3Ehh%3Ctspan fill='%23f0a3a8'%3E=%23%3C/tspan%3E%3C/text%3E%3C/svg%3E">
  <script>
    // Тема (#120): system | dark | light, выбор в localStorage; до отрисовки, чтобы не мигало
    try { const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    /* Светлая — парная к тёмной «как профиль»; тёмная — по системе или переключателю */
    :root {
      color-scheme: light;
      --bg: #f6f8fa; --card: #ffffff; --card2: #f0f3f6; --text: #1f2328; --muted: #59636e; --border: #d0d7de; --grid: #e4e8ec;
      --accent: #c2414c; --on-accent: #ffffff; --accent-soft: #fbe7e9;
      --ok: #1a7f37; --on-ok: #ffffff; --bad: #cf222e; --warn-bg: #fff8c5; --warn: #7a5400;
      --bar: #e7c9cc; --track: #eaeef2;
      --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0d1117; --card: #161b22; --card2: #1c222b; --text: #e6edf3; --muted: #8b98a8; --border: #263040; --grid: #1a222d;
        --accent: #f0a3a8; --on-accent: #2a0f12; --accent-soft: #3a2a2e;
        --ok: #7ee2a8; --on-ok: #0b2a19; --bad: #ff8b8b; --warn-bg: #2b2414; --warn: #f2c66d;
        --bar: #3a2a2e; --track: #1f2631;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117; --card: #161b22; --card2: #1c222b; --text: #e6edf3; --muted: #8b98a8; --border: #263040; --grid: #1a222d;
      --accent: #f0a3a8; --on-accent: #2a0f12; --accent-soft: #3a2a2e;
      --ok: #7ee2a8; --on-ok: #0b2a19; --bad: #ff8b8b; --warn-bg: #2b2414; --warn: #f2c66d;
      --bar: #3a2a2e; --track: #1f2631;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans);
      background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px;
      overflow-wrap: anywhere;
    }
    .mono, .num { font-family: var(--mono); }

    /* Шапка */
    header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    .top { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .mark { font: 700 14px var(--mono); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; background: var(--card); color: var(--text); text-decoration: none; white-space: nowrap; }
    .mark b { color: var(--accent); }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 600; }
    .brand .name { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    #who { font: 13px var(--mono); color: var(--muted); }
    .icon { min-width: 36px; padding: 6px 10px; font-family: var(--mono); }
    nav#nav { max-width: 1100px; margin: 0 auto; padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    nav#nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; font-size: 14px; }
    nav#nav a:hover { color: var(--text); }
    nav#nav a.active { color: var(--text); background: var(--card); border-color: var(--border); }
    .count { font: 600 11px var(--mono); color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

    /* Нижняя панель (телефон) */
    #tabbar { display: none; }
    #more { position: fixed; z-index: 40; left: 8px; right: 8px; bottom: calc(72px + env(safe-area-inset-bottom)); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #more a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--text); text-decoration: none; }
    #more a.active { background: var(--accent-soft); }

    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0 0 8px; }
    h3 { margin: 0 0 12px; font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .sub, .muted { color: var(--muted); }
    .sub { margin: 0 0 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    input, textarea, select, button { font: inherit; color: inherit; }
    input, textarea, select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[type=checkbox] { width: auto; accent-color: var(--accent); }
    button { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); }
    #status { color: var(--muted); min-height: 1.5em; }
    #statusbar:has(#status:empty) { display: none; }
    th { overflow-wrap: normal; }
    .cols.wide-left { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    #status.error { color: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .tile b { display: block; font: 700 24px var(--mono); }
    .tile span { color: var(--muted); font-size: 13px; }
    a { color: var(--accent); }
    .meta { color: var(--muted); font-size: 14px; }
    .reason { font-size: 14px; margin-top: 4px; }
    .pill { display: inline-block; border-radius: 6px; padding: 0 7px; font: 600 12px var(--mono); background: var(--card2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .src { display: inline-flex; align-items: center; gap: 5px; }
    .src i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ff6b78; }
    details { margin-top: 6px; }
    summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    .pre { white-space: pre-wrap; font-size: 14px; }
    .form { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
    .form label { color: var(--muted); font-size: 14px; }
    .form textarea { min-height: 120px; resize: vertical; }
    .form input[type=checkbox] { justify-self: start; }
    .form .wide { grid-column: 1 / -1; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.n, th.n { text-align: right; font-family: var(--mono); }
    .secret { font-family: var(--mono); background: var(--warn-bg); color: var(--warn); padding: 8px 10px; border-radius: 8px; word-break: break-all; }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; }
    /* Проверка и ответы работодателей */
    .verdict, .summary { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; }
    .msg { white-space: pre-wrap; font-size: 14px; border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin: 8px 0; }
    .kind { display: inline-block; border-radius: 6px; padding: 1px 8px; font: 600 12px var(--mono); margin-right: 6px; border: 1px solid var(--border); }
    .kind.Invitation { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
    .kind.Question { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .desc { white-space: pre-wrap; font-size: 14px; max-height: 320px; overflow: auto; padding: 8px 0; }
    label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    .card textarea { width: 100%; min-height: 160px; resize: vertical; }
    .letter { font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .actions input { flex: 1 1 200px; min-width: 0; }
    .approve { background: var(--ok); border-color: var(--ok); color: var(--on-ok); font-weight: 600; }
    .result { align-self: center; font-weight: 600; color: var(--accent); }
    .decided { opacity: .55; }

    /* Дашборд (#121) */
    .dash-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
    .dash-head > div:first-child { margin-right: auto; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font: 12px var(--mono); background: var(--card); }
    .seg button { border: 0; border-radius: 0; padding: 6px 12px; color: var(--muted); background: transparent; }
    .seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
    .sources button { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); color: var(--muted); }
    .sources button.on { color: var(--text); border-color: var(--accent); }
    .sources button:disabled { border-style: dashed; }
    .sources i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .kpi { margin: 0; }
    .kpi b { display: block; font: 700 26px var(--mono); }
    .kpi span { font-size: 12px; color: var(--muted); }
    .kpi i { display: block; font: normal 12px var(--mono); color: var(--muted); margin-top: 2px; }
    .kpi i.up { color: var(--ok); } .kpi i.down { color: var(--bad); }
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; }
    .funnel .f { display: grid; grid-template-columns: 124px minmax(0, 1fr) 48px 44px; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
    .funnel em { font-style: normal; color: var(--muted); }
    .track { height: 16px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .track s { display: block; height: 100%; border-radius: 4px; background: var(--accent); text-decoration: none; min-width: 2px; }
    .funnel b { font: 600 12px var(--mono); text-align: right; }
    .funnel small { font: 11px var(--mono); color: var(--muted); text-align: right; }
    .bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; border-bottom: 1px solid var(--border); }
    .bars > div { flex: 1; min-width: 3px; background: var(--bar); border-radius: 3px 3px 0 0; position: relative; display: flex; flex-direction: column-reverse; overflow: hidden; }
    .bars u { display: block; background: var(--accent); }
    .bars u.inv { background: var(--ok); }
    .days { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .reasons li { display: flex; gap: 10px; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    .reasons { list-style: none; margin: 0; padding: 0; }
    .demo-note { font: 12px var(--mono); color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin-bottom: 14px; }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cols, .cols.wide-left { grid-template-columns: minmax(0, 1fr); }
    }

    /* Телефон (#120): нижняя панель, карточки вместо таблиц, касание ≥ 44px */
    @media (max-width: 720px) {
      body { font-size: 15px; }
      nav#nav { display: none; }
      .brand .name { display: none; }
      #tabbar:not([hidden]) {
        display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border);
      }
      #tabbar a, #tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: none; padding: 0; color: var(--muted); text-decoration: none; font-size: 11px; position: relative; }
      #tabbar b { font: 700 17px var(--mono); }
      #tabbar .active, #tabbar .active b { color: var(--accent); }
      #tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
      main { padding: 14px 12px calc(96px + env(safe-area-inset-bottom)); }
      h1 { font-size: 20px; }
      .card { padding: 14px; }
      .form { grid-template-columns: minmax(0, 1fr); gap: 4px; }
      .form label { margin-top: 8px; }
      .form input[type=checkbox] { width: 22px; height: 22px; }
      input, select, textarea, button { min-height: 44px; }
      input[type=checkbox] { min-height: 0; }
      .bar > select, .bar > input:not([type=checkbox]) { flex: 1 1 100%; }
      .actions > button, .actions > input { flex: 1 1 100%; }
      .actions > .result { flex: 1 1 100%; text-align: center; }
      .seg button { min-height: 36px; }
      /* Таблица → карточки «поле: значение» */
      table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
      table.stack thead { display: none; }
      table.stack tr { border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; background: var(--card2); }
      table.stack td { display: grid; grid-template-columns: 42% minmax(0, 1fr); gap: 8px; border: 0; padding: 4px 0; text-align: left; }
      table.stack td.n { text-align: left; }
      table.stack td::before { content: attr(data-label); color: var(--muted); font: 12px var(--sans); }
      table.stack td[data-label=""] { grid-template-columns: minmax(0, 1fr); }
      table.stack td[data-label=""]::before { display: none; }
      .funnel .f { grid-template-columns: 96px minmax(0, 1fr) 40px 38px; gap: 6px; }
      .kpi b { font-size: 22px; }
    }
  </style>
</head>
<body>
<header>
  <div class="top">
    <a class="brand" href="#dashboard" style="text-decoration:none;color:inherit"><span class="mark">hh<b>=#</b></span><span class="name">autoapplier</span></a>
    <span id="viewing" hidden><label class="muted" for="view-as">Данные:</label> <select id="view-as"></select></span>
    <span id="who"></span>
    <button id="theme" class="icon" type="button" title="Тема" aria-label="Тема">◐</button>
    <button id="logout" hidden>Выйти</button>
  </div>
  <nav id="nav" hidden aria-label="Разделы"></nav>
</header>

<main>
  <form id="login" class="card" hidden>
    <h1>Вход</h1>
    <p class="sub">Email и пароль учётной записи backend.</p>
    <div class="bar">
      <input id="email" type="email" placeholder="Email" autocomplete="username" aria-label="Email" required>
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль" required>
      <button class="primary">Войти</button>
    </div>
  </form>

  <div class="bar" id="statusbar"><span id="status" role="status"></span></div>
  <section id="view"></section>
</main>

<nav id="tabbar" hidden aria-label="Разделы"></nav>
<div id="more" hidden></div>

<script src="app.js"></script>
</body>
</html>
