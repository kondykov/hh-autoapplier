services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hhapplier
      POSTGRES_USER: hhapplier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hhapplier}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhapplier -d hhapplier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=hhapplier;Username=hhapplier;Password=${POSTGRES_PASSWORD:-hhapplier}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Cors__Origins: ${CORS_ORIGINS:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Hh__Enabled: ${HH_ENABLED:-true}
      Collector__IntervalMinutes: ${COLLECT_INTERVAL_MINUTES:-60}
      Collector__MaxPages: ${COLLECT_MAX_PAGES:-20}
      Collector__MaxArchiveChecks: ${COLLECT_MAX_ARCHIVE_CHECKS:-10}
      Llm__Provider: ${LLM_PROVIDER:-openai}
      Llm__Scope: ${LLM_SCOPE:-GIGACHAT_API_PERS}
      Llm__JsonMode: ${LLM_JSON_MODE:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__BaseUrl: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      Llm__Model: ${LLM_MODEL:-openai/gpt-oss-120b}
      Llm__DailyRequestLimit: ${LLM_DAILY_LIMIT:-300}
      Llm__UserDailyRequestLimit: ${LLM_USER_DAILY_LIMIT:-150}
      # Маршруты под задачи (#104): пусто — основной провайдер; другой провайдер или адрес — со своим ключом
      Llm__Routes__Evaluation__Provider: ${LLM_EVALUATION_PROVIDER:-}
      Llm__Routes__Evaluation__BaseUrl: ${LLM_EVALUATION_BASE_URL:-}
      Llm__Routes__Evaluation__ApiKey: ${LLM_EVALUATION_API_KEY:-}
      Llm__Routes__Evaluation__Model: ${LLM_EVALUATION_MODEL:-}
      Llm__Routes__Letters__Provider: ${LLM_LETTERS_PROVIDER:-}
      Llm__Routes__Letters__BaseUrl: ${LLM_LETTERS_BASE_URL:-}
      Llm__Routes__Letters__ApiKey: ${LLM_LETTERS_API_KEY:-}
      Llm__Routes__Letters__Model: ${LLM_LETTERS_MODEL:-}
      Llm__Routes__Questionnaires__Provider: ${LLM_QUESTIONNAIRES_PROVIDER:-}
      Llm__Routes__Questionnaires__BaseUrl: ${LLM_QUESTIONNAIRES_BASE_URL:-}
      Llm__Routes__Questionnaires__ApiKey: ${LLM_QUESTIONNAIRES_API_KEY:-}
      Llm__Routes__Questionnaires__Model: ${LLM_QUESTIONNAIRES_MODEL:-}
      Llm__Routes__Dialogs__Provider: ${LLM_DIALOGS_PROVIDER:-}
      Llm__Routes__Dialogs__BaseUrl: ${LLM_DIALOGS_BASE_URL:-}
      Llm__Routes__Dialogs__ApiKey: ${LLM_DIALOGS_API_KEY:-}
      Llm__Routes__Dialogs__Model: ${LLM_DIALOGS_MODEL:-}
      # Исходящий прокси машины (#5, #84): с российского IP Groq и Telegram напрямую недоступны. Пусто — без прокси.
      # hh.ru в исключениях по умолчанию: сбор не зависит от VPN
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-hh.ru,.hh.ru,db,localhost,127.0.0.1}
    extra_hosts:
      # Прокси на самом сервере: host.docker.internal — адрес хоста на docker0
      - "host.docker.internal:host-gateway"
    ports:
      # API_BIND=0.0.0.0 — доступ из домашней сети (#100); ufw порты Docker не фильтрует, снаружи закрывает только роутер
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      # Ключи подписи cookie: вне тома при каждом up --build слетают сессии входа
      - dpkeys:/root/.aspnet/DataProtection-Keys

volumes:
  pgdata:
  dpkeys:
